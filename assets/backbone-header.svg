      <rect x="195" y="338" width="105" height="29" rx="7" fill="#142b30" stroke="#355c5b"/>
      <text x="247.5" y="357" text-anchor="middle">LOCAL-FIRST</text>
      <rect x="310" y="338" width="129" height="29" rx="7" fill="#142b30" stroke="#355c5b"/>
      <text x="374.5" y="357" text-anchor="middle">SECURITY LAWS</text>
